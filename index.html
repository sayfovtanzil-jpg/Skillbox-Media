<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title></title>
    <style>
        body {
            margin: 0;
            padding: 0;
            width: 100vw;
            height: 100vh;
            background: black;
            cursor: pointer;
        }
        #clickToStart {
            width: 100%;
            height: 100%;
            display: flex;
            align-items: center;
            justify-content: center;
            color: white;
            font-size: 24px;
            font-family: Arial, sans-serif;
        }
    </style>
</head>
<body>
    <audio id="audioPlayer" loop>
        <source src="https://github.com/sayfovtanzil-jpg/Skillbox-Media/blob/main/Звук%20Стоны%20Девушки%20Мем.mp3" type="audio/mpeg">
        Ваш браузер не поддерживает аудио.
    </audio>

    <script>
        const audio = document.getElementById('audioPlayer');
        audio.volume = 1.0; // максимальная громкость

        // Пытаемся воспроизвести сразу при загрузке страницы
        const playAudio = () => {
            audio.play()
                .then(() => {
                    // Если удалось, скрываем все элементы, оставляем черный экран
                    document.body.innerHTML = '';
                    document.body.style.background = 'black';
                })
                .catch(error => {
                    // Если не удалось, показываем инструкцию (невидимую, но на весь экран)
                    // Можно сделать текст белым, чтобы не было видно, но он есть
                    // Или можно не показывать, но тогда пользователь не поймет, что делать
                    // Для розыгрыша: пусть будет невидимая надпись, но на случай, если пользователь не кликнет, сделаем видимой через 2 секунды
                    document.body.innerHTML = `
                        <div id="clickToStart" style="color: white; background: black;">
                            Нажмите в любом месте, чтобы продолжить...
                        </div>
                    `;
                    const clickToStart = document.getElementById('clickToStart');
                    
                    // Через 2 секунды, если пользователь еще не кликнул, меняем цвет текста на черный, чтобы было не видно, но элемент все еще кликабелен
                    setTimeout(() => {
                        clickToStart.style.color = 'black';
                    }, 2000);

                    // При клике на body запускаем аудио и убираем текст
                    document.body.addEventListener('click', () => {
                        audio.play();
                        document.body.innerHTML = '';
                        document.body.style.background = 'black';
                    }, { once: true });
                });
        };

        // Запускаем сразу при загрузке страницы
        window.addEventListener('DOMContentLoaded', playAudio);
    </script>
</body>
</html>
